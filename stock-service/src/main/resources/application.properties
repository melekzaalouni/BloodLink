spring.application.name=stock-service
server.port=8082

# gRPC
grpc.server.port=9090
grpc.server.reflection-service-enabled=true

# PostgreSQL (valeurs par défaut pour le dev local, surchargées par Docker via variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockdb}
spring.datasource.username=${DB_USER:bloodlink}
spring.datasource.password=${DB_PASSWORD:bloodlink}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info