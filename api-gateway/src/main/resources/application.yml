server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        - id: donor-service
          uri: ${DONOR_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

        - id: donor-docs
          uri: ${DONOR_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health,info